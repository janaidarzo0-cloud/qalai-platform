name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qalai
          POSTGRES_USER: qalai
          POSTGRES_PASSWORD: qalai_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qalai -d qalai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qalai:qalai_ci_only@localhost:5432/qalai
      DATABASE_DIRECT_URL: postgresql://qalai:qalai_ci_only@localhost:5432/qalai
      PAYLOAD_SECRET: ci-only-payload-secret-that-is-not-used-anywhere-else
      NEXT_PUBLIC_SITE_URL: https://qalai.example.test
      PAYLOAD_DB_PUSH: 'false'
      QALAI_CONTENT_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - run: npm run generate:importmap
      - name: Detect schema changes without a migration
        run: npm run db:migrate:create -- ci_schema_drift --skip-empty
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
      - name: Apply baseline migrations twice
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Seed twice to prove idempotency
        run: |
          npm run db:seed
          npm run db:seed
      - name: CMS and draft-isolation integration gate
        run: npm run test:integration:cms
        env:
          QALAI_CONTENT_MODE: cms
          QALAI_RUN_CMS_INTEGRATION: 'true'
      - name: Runtime checks do not modify generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
